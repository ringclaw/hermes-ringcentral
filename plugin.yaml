name: ringcentral-platform
label: RingCentral
kind: platform
provides_tools:
  - ringcentral_get_recent_messages
version: 1.0.0
description: >
  RingCentral Team Messaging gateway adapter for Hermes Agent.
  Connects a RingCentral bot to the Hermes agent via the v1
  Team Messaging REST API + WebSocket subscription stream.
author: Nous Research
requires_env:
  - name: RC_BOT_TOKEN
    description: "RingCentral bot JWT from the RingCentral developer portal"
    prompt: "RingCentral bot token (JWT)"
    password: true
    secret: true
optional_env:
  - name: RC_SERVER_URL
    description: "RingCentral API base URL. Use https://platform.devtest.ringcentral.com for sandbox."
    prompt: "RingCentral server URL"
    password: false
  - name: RC_USER_CLIENT_ID
    description: "Owner OAuth app client ID. Enables owner-only history reads and fallback sends with RC_USER_CLIENT_SECRET and RC_USER_JWT_TOKEN."
    prompt: "Owner client ID"
    password: false
  - name: RC_USER_CLIENT_SECRET
    description: "Owner OAuth app client secret."
    prompt: "Owner client secret"
    password: true
    secret: true
  - name: RC_USER_JWT_TOKEN
    description: "Owner JWT token."
    prompt: "Owner JWT token"
    password: true
    secret: true
  - name: RC_ALLOWED_USER_EMAILS
    description: "Comma/semicolon-separated RingCentral user emails allowed to talk to the bot."
    prompt: "Allowed user emails"
    password: false
  - name: RC_ALLOW_ALL_USERS
    description: "Allow any RingCentral user to trigger the bot (dev only)."
    prompt: "Allow all users? (true/false)"
    password: false
  - name: RC_ALLOWED_CHANNELS
    description: "Comma/semicolon-separated RingCentral chat IDs where the bot may respond. Use * to allow all."
    prompt: "Allowed chat IDs"
    password: false
  - name: RC_IGNORED_CHANNELS
    description: "Comma/semicolon-separated RingCentral chat IDs where the bot never responds."
    prompt: "Ignored chat IDs"
    password: false
  - name: RC_REQUIRE_MENTION
    description: "Require a bot mention in RingCentral group/team chats before triggering Hermes (default: true)."
    prompt: "Require mention in groups? (true/false)"
    password: false
  - name: RC_FREE_RESPONSE_CHANNELS
    description: "RingCentral chat IDs where authorized users can trigger Hermes without mentioning the bot."
    prompt: "Free-response chat IDs"
    password: false
  - name: RC_THREAD_REQUIRE_MENTION
    description: "Require a bot mention for follow-up messages in threads the bot has already joined (default: false)."
    prompt: "Require mention in threads? (true/false)"
    password: false
  - name: RC_NO_THREAD_CHANNELS
    description: "RingCentral chat IDs where replies should be regular posts instead of thread replies."
    prompt: "No-thread chat IDs"
    password: false
  - name: RC_HISTORY_MESSAGE_LIMIT
    description: "Recent messages to fetch with the owner token for Hermes history-tool reads (default: 250, max: 1000)."
    prompt: "History message limit"
    password: false
  - name: RC_REPLY_TO_MODE
    description: "Threaded reply mode for RingCentral posts: first (default), all, or off."
    prompt: "Reply-to mode"
    password: false
  - name: RC_HOME_CHANNEL
    description: "Default chat/group ID for cron and notification delivery."
    prompt: "Home chat ID"
    password: false
  - name: RC_HOME_CHANNEL_NAME
    description: "Display name for the home chat."
    prompt: "Home chat display name"
    password: false
