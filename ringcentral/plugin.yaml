name: ringcentral-platform
label: RingCentral
kind: platform
provides_tools:
  - ringcentral_get_recent_messages
  - ringcentral_confirm_artifact_action
  - ringcentral_list_calendar_events
  - ringcentral_create_calendar_event
  - ringcentral_get_calendar_event
  - ringcentral_update_calendar_event
  - ringcentral_delete_calendar_event
  - ringcentral_create_adaptive_card
  - ringcentral_get_adaptive_card
  - ringcentral_update_adaptive_card
  - ringcentral_delete_adaptive_card
  - ringcentral_list_notes
  - ringcentral_create_note
  - ringcentral_get_note
  - ringcentral_update_note
  - ringcentral_delete_note
  - ringcentral_publish_note
version: 1.0.0
description: >
  RingCentral Team Messaging gateway adapter for Hermes Agent.
  Connects a RingCentral bot to the Hermes agent via the v1
  Team Messaging REST API + WebSocket subscription stream.
  Relays posts in chats (DMs / teams / groups) to the agent and
  delivers replies, file uploads, and edits back through the
  RingCentral platform.
author: Nous Research
requires_env:
  - name: RC_BOT_TOKEN
    description: "RingCentral bot JWT (Bearer token issued by the RingCentral developer portal)"
    prompt: "RingCentral bot token (JWT)"
    password: true
optional_env:
  - name: RC_SERVER_URL
    description: "RingCentral API base URL (default: https://platform.ringcentral.com). Use https://platform.devtest.ringcentral.com for sandbox."
    prompt: "RingCentral server URL"
    password: false
  - name: RC_USER_CLIENT_ID
    description: "Owner OAuth app client ID. Enables owner-only group observation and fallback sends when paired with RC_USER_CLIENT_SECRET and RC_USER_JWT_TOKEN."
    prompt: "Owner client ID"
    password: false
  - name: RC_USER_CLIENT_SECRET
    description: "Owner OAuth app client secret. Optional; only used with RC_USER_CLIENT_ID and RC_USER_JWT_TOKEN."
    prompt: "Owner client secret"
    password: true
  - name: RC_USER_JWT_TOKEN
    description: "Owner JWT token. Optional; only used with RC_USER_CLIENT_ID and RC_USER_CLIENT_SECRET."
    prompt: "Owner JWT token"
    password: true
  - name: RC_ALLOWED_USER_EMAILS
    description: "Comma/semicolon-separated RingCentral user emails allowed to talk to the bot. If omitted and owner mode is configured, the owner email is auto-seeded."
    prompt: "Allowed user emails (comma-separated)"
    password: false
  - name: RC_ALLOW_ALL_USERS
    description: "Allow any RingCentral user to trigger the bot (dev only)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: RC_ALLOWED_CHANNELS
    description: "Comma/semicolon-separated RingCentral chat IDs where the bot may respond. If set, group/team chats outside this list are ignored. Use * to allow all."
    prompt: "Allowed chat IDs (comma-separated)"
    password: false
  - name: RC_IGNORED_CHANNELS
    description: "Comma/semicolon-separated RingCentral chat IDs where the bot never responds. Takes precedence over RC_ALLOWED_CHANNELS. Use * to ignore all group/team chats."
    prompt: "Ignored chat IDs (comma-separated)"
    password: false
  - name: RC_REQUIRE_MENTION
    description: "Require a bot mention in RingCentral group/team chats before triggering Hermes (default: true)."
    prompt: "Require mention in groups? (true/false)"
    password: false
  - name: RC_FREE_RESPONSE_CHANNELS
    description: "Comma/semicolon-separated RingCentral chat IDs where authorized users can trigger Hermes without mentioning the bot. Use * for all group/team chats."
    prompt: "Free-response chat IDs (comma-separated)"
    password: false
  - name: RC_THREAD_REQUIRE_MENTION
    description: "Require a bot mention for follow-up messages in RingCentral threads the bot has already joined (default: false)."
    prompt: "Require mention in threads? (true/false)"
    password: false
  - name: RC_NO_THREAD_CHANNELS
    description: "Comma/semicolon-separated RingCentral chat IDs where replies should be regular posts instead of thread replies. Use * for all chats."
    prompt: "No-thread chat IDs (comma-separated)"
    password: false
  - name: RC_HISTORY_MESSAGE_LIMIT
    description: "Recent messages to fetch with the owner token for Hermes history-tool reads (default: 250, max: 1000)."
    prompt: "History message limit"
    password: false
  - name: RC_REPLY_TO_MODE
    description: "Threaded reply mode for RingCentral posts: first (default), all, or off."
    prompt: "Reply-to mode"
    password: false
  - name: RC_HOME_CHANNEL
    description: "Default chat/group ID for cron / notification delivery"
    prompt: "Home chat ID"
    password: false
  - name: RC_HOME_CHANNEL_NAME
    description: "Display name for the home chat (used in gateway status)"
    prompt: "Home chat display name"
    password: false
